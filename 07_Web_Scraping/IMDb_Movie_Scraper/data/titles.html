<!DOCTYPE html>
<html lang="en">
<head><title>Top titles</title></head>
<body>
<ul class="title-list">

  <!-- the same length, printed two ways -->
  <li class="row film">
    <span class="title">Long One</span>
    <span class="runtime">2h 15min</span>
    <span class="year">2020</span>
  </li>

  <li class="row film">
    <span class="title">Long Two</span>
    <span class="runtime">135 min</span>
    <span class="year">2021</span>
  </li>

  <li class="row film">
    <span class="title">Short One</span>
    <span class="runtime">1h 47min</span>
    <span class="year">2019</span>
  </li>

  <!-- this film prints no runtime at all -->
  <li class="row film">
    <span class="title">Unknown</span>
    <span class="runtime"></span>
    <span class="year">2018</span>
  </li>

  <!-- a series: a runtime per episode, and a count of episodes -->
  <li class="row series">
    <span class="title">A Show</span>
    <span class="runtime">47 min</span>
    <span class="episodes">24</span>
  </li>

</ul>
</body>
</html>
